# Optional developer tooling — local quality & secrets gates.
# Install once per clone:
#     pip install pre-commit
#     pre-commit install
#     pre-commit autoupdate   # refresh hook revisions
#
# gitleaks blocks any commit containing API keys, tokens, or private keys.
# check-added-large-files blocks accidental commit of model weights/datasets.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=10240']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
